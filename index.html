<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acessos · Saint Germain</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
:root{--preto:#000;--branco:#fff;--g1:#414142;--g2:#5b5b60;--g3:#aea9b4;--linha:#e6e4e9;--fundo:#f7f7f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Questrial',sans-serif;background:var(--fundo);color:var(--preto);font-size:14px}
button,input,select{font-family:inherit;font-size:inherit}
header{background:var(--preto);color:var(--branco);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
html.sc-dentro header{display:none}
.marca{letter-spacing:.32em;font-size:13px}
.marca b{font-weight:400;display:block;font-size:20px;letter-spacing:.18em;margin-top:2px}
.quem{font-size:12px;color:var(--g3);letter-spacing:.06em}
nav{background:var(--branco);border-bottom:1px solid var(--linha);display:flex;padding:0 28px;gap:4px;overflow-x:auto}
nav button{background:none;border:0;padding:15px 16px;color:var(--g2);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.06em;white-space:nowrap}
nav button.ativo{color:var(--preto);border-color:var(--preto)}
main{padding:24px 28px;max-width:1300px;margin:0 auto}
.barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.barra input,.barra select{border:1px solid var(--linha);background:#fff;padding:10px 12px;border-radius:4px;min-width:190px}
.barra .esp{flex:1}
.btn{background:var(--preto);color:#fff;border:0;padding:10px 16px;border-radius:4px;cursor:pointer;letter-spacing:.04em}
.btn.sec{background:#fff;color:var(--preto);border:1px solid var(--preto)}
.btn.min{padding:6px 12px;font-size:12px}
.btn:hover{opacity:.85}.btn:disabled{opacity:.5;cursor:wait}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin-bottom:22px}
.resumo div{background:#fff;border:1px solid var(--linha);padding:14px 14px;border-radius:6px}
.resumo div.dest{background:var(--preto);border-color:var(--preto);color:#fff}.resumo div.dest small{color:var(--g3)}
.resumo small{color:var(--g2);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.resumo b{display:block;font-weight:400;font-size:26px;margin-top:4px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--linha);border-radius:6px;overflow:hidden}
.card.alerta{border-color:var(--preto)}
.card.off{opacity:.55}.card.off .topo{background:var(--g2)}
.topo{background:var(--preto);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.topo span{letter-spacing:.08em}
.eq{font-size:10px;letter-spacing:.14em;color:var(--g3);border:1px solid var(--g2);padding:3px 7px;border-radius:3px;margin-left:8px;white-space:nowrap}
.topo button{background:none;border:1px solid var(--g2);color:var(--g3);padding:4px 10px;border-radius:3px;cursor:pointer;font-size:12px}
.info{padding:12px 16px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.email{color:var(--g1);font-size:13px;word-break:break-all}
.pessoa{display:flex;align-items:center;gap:6px}
.tag{font-size:11px;padding:4px 9px;border-radius:20px;letter-spacing:.04em;white-space:nowrap}
.tag.ativo{background:#ececee;color:var(--preto)}
.tag.trein{background:var(--g3);color:#fff}
.tag.vaga{background:var(--preto);color:#fff}
.tag.off{background:#fff;color:var(--g2);border:1px solid var(--g3)}
.aviso{background:var(--g1);color:#fff;font-size:12px;padding:9px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.aviso.leve{background:#ececee;color:var(--preto)}.aviso.leve button{background:var(--preto);color:#fff}
.req{background:var(--fundo);border:1px solid var(--linha);border-radius:4px;padding:12px 14px;display:grid;gap:6px}
.req .r{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.req .ok{color:var(--g2);font-size:12px}.req .falta{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--preto);color:#fff;white-space:nowrap}.req .nc{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid var(--g3);color:var(--g2);white-space:nowrap}
.lin.nec>span:first-child{color:var(--preto)}.lin.nec>span:first-child::after{content:' · necessário';color:var(--g2);font-size:11px}
.aviso button{background:#fff;color:var(--preto);border:0;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:12px}
ul.plat{list-style:none}
ul.plat li{display:grid;grid-template-columns:110px 1fr auto;align-items:center;padding:8px 16px;border-bottom:1px solid #f1f0f3;gap:8px;font-size:13px}
ul.plat li:last-child{border:0}
ul.plat li.off{background:#fafafb}
ul.plat li.off .nome,ul.plat li.off .senha,ul.plat li.off .via{color:var(--g3)}
.nome{color:var(--g2)}
.senha{letter-spacing:.06em;word-break:break-all}
.senha.oculta{letter-spacing:.2em;color:var(--g3)}
.via{color:var(--g2);font-size:12px}
.na{color:var(--g3);font-size:12px}
.pendente{text-decoration:line-through;text-decoration-color:var(--g3)}
.acoes{display:flex;gap:4px;align-items:center}
.ic{background:none;border:1px solid var(--linha);border-radius:3px;width:28px;height:26px;cursor:pointer;display:grid;place-items:center;color:var(--g1);flex:none}
.ic:hover{border-color:var(--preto);color:var(--preto)}
.ic:disabled{opacity:.3;cursor:default}
.ic svg{width:14px;height:14px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linha)}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--linha);font-size:13px}
th{background:var(--preto);color:#fff;font-weight:400;letter-spacing:.08em;font-size:12px}
tr.off td{color:var(--g3)}
.tabela{overflow-x:auto}
.vazio{padding:50px;text-align:center;color:var(--g2);background:#fff;border:1px solid var(--linha);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal.aberto{display:flex}
.caixa{background:#fff;border-radius:6px;width:100%;max-width:640px}
.caixa h3{font-weight:400;background:var(--preto);color:#fff;padding:16px 20px;letter-spacing:.1em;border-radius:6px 6px 0 0}
.corpo{padding:20px;display:grid;gap:12px}
.corpo label{font-size:12px;color:var(--g2);display:grid;gap:5px}
.corpo label.ck{display:flex;align-items:center;gap:8px;color:var(--preto);font-size:13px}
.corpo label.ck input{width:auto}
.corpo input,.corpo select{border:1px solid var(--linha);padding:9px 10px;border-radius:4px;width:100%}
.lin{display:grid;grid-template-columns:110px 140px 1fr;gap:8px;align-items:center}
.lin.off span{color:var(--g3)}
.sep{font-size:11px;letter-spacing:.12em;color:var(--g2);border-top:1px solid var(--linha);padding-top:12px}
.rodape{padding:14px 20px;border-top:1px solid var(--linha);display:flex;justify-content:flex-end;gap:8px}
.check li,.hist li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha);font-size:13px}
.hist li{justify-content:space-between;color:var(--g1)}
.hist small{color:var(--g3)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--preto);color:#fff;padding:11px 20px;border-radius:4px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ic.girando svg{animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.bloqueio{text-align:center;padding:80px 20px;color:var(--g2)}
.bloqueio b{display:block;color:var(--preto);font-weight:400;font-size:20px;letter-spacing:.12em;margin-bottom:8px}
.bloqueio .btn{margin-top:20px;display:inline-block;text-decoration:none}
@media(max-width:600px){header,nav,main{padding-left:16px;padding-right:16px}.grade{grid-template-columns:1fr}.lin{grid-template-columns:1fr}ul.plat li{grid-template-columns:90px 1fr auto}}
</style>
<script>if(window.self!==window.top)document.documentElement.classList.add('sc-dentro');</script>
</head>
<body>
<header>
  <div class="marca">SAINT GERMAIN<b>ACESSOS</b></div>
  <div class="quem" id="quem"></div>
</header>
<nav id="abas" hidden>
  <button class="ativo" data-aba="posicoes">POSIÇÕES</button>
  <button data-aba="padrao">ACESSOS POR SETOR</button>
  <button data-aba="sistemas">SISTEMAS</button>
  <button data-aba="compart">CONTAS COMPARTILHADAS</button>
  <button data-aba="historico">HISTÓRICO</button>
</nav>
<main id="app"><div class="bloqueio">Carregando…</div></main>

<div class="modal" id="modal"><div class="caixa" id="caixa"></div></div>
<input type="file" id="arquivo" accept=".csv" hidden onchange="importar(event)">
<div class="toast" id="toast"></div>

<script>
/* ===== Configuração ===== */
const API = 'https://script.google.com/macros/s/AKfycbwQPyL6HaJGebsEyQjYYmc6zqh4hLRFYrwD4fWBntIb6zAwH9YzUIVMlMosWojUa-U/exec'; // link do app do Apps Script "Saint Center · Acessos" (termina em /exec)
const SC_CENTER = 'https://saintgermainb-hub.github.io/saintcenter/';
const EQUIPES = ['Equipe 01','Equipe 02'];

/* ===== Padrão de acessos por setor =====
   Nomes alternativos (al) servem para reconhecer o sistema como ele está cadastrado na aba Sistemas. */
const SIS = {
  google:{nome:'Conta Google',al:['google','contagoogle','gmail']}, bling:{nome:'Bling',al:['bling']},
  desk:{nome:'SaintDesk',al:['saintdesk']}, nuvem:{nome:'Nuvem',al:['nuvem','nuvemshop']}, slack:{nome:'Slack',al:['slack']},
  wms:{nome:'WMS Saint',al:['wmsexpedicao','wms','wmssaint','wsmsaint']}, jt:{nome:'J&T',al:['j&t','jt','transportadoraj&t']},
  estoca:{nome:'Estoca',al:['estoca']}, mandae:{nome:'Mandaê',al:['mandae']}, anjun:{nome:'Anjun',al:['anjun']},
  correios:{nome:'Correios',al:['correios']}, frete:{nome:'FreteBarato',al:['fretebarato']}, total:{nome:'Total',al:['total','totalexpress']},
  loggi:{nome:'Loggi',al:['loggi']}, trocas:{nome:'SaintTrocas',al:['sainttrocas','saintrocas']},
  primie:{nome:'Laboratório Primie',al:['laboratorioprimie','primie']}, iguacu:{nome:'Laboratório Iguaçu',al:['laboratorioiguacu','iguacu']},
  repro:{nome:'Laboratório Repro',al:['laboratoriorepro','repro']},
  ml:{nome:'Mercado Livre',al:['mercadolivre']},
  ra:{nome:'Reclame Aqui',al:['reclameaqui','reclameaquiadm','reclameaquisuporte']}, procon:{nome:'Procon',al:['procon']},
  whatsjur:{nome:'WhatsApp grupo Jurídico',al:['whatsappgrupojuridico','whatsappjuridico','grupojuridico']},
  igsg:{nome:'Instagram SG',al:['instagramsg','instagramsaintgermain']}, iguana:{nome:'Instagram Uana',al:['instagramuana','uana']}, tiktok:{nome:'TikTok',al:['tiktok','tiktokshop']}, shopee:{nome:'Shopee',al:['shopee','shope']}
};
const TODOS = ['google','bling','desk','nuvem','slack'];
const TRANSP = ['wms','jt','estoca','mandae','anjun','correios','frete','total','loggi'];
// ordem = ordem da lista de setores no cadastro
const PADRAO = [
  {setor:'Coordenação', tudo:true, chaves:['coordenacao']},
  {setor:'Supervisão', tudo:true, chaves:['supervisao']},
  {setor:'Líder', tudo:true, chaves:['lider','lideranca']},
  {setor:'Ticket Transporte', sis:TRANSP, chaves:['tickettransporte']},
  {setor:'Torre de Controle', sis:TRANSP, chaves:['torredecontrole'], obs:'mesmo acesso de Ticket Transporte'},
  {setor:'Trocas & Devoluções', sis:['trocas'], chaves:['trocas&devolucoes','trocasedevolucoes','trocaedevolucao','trocasdevolucoes']},
  {setor:'Personalizados', sis:['primie','iguacu','repro'], chaves:['personalizados','lentes','suportelentes']},
  {setor:'Marketplace', sis:['ml','tiktok','shopee'], chaves:['marketplace']},
  {setor:'Customer Success', sis:['ra','procon','whatsjur','igsg','iguana'], chaves:['customersuccess','cs']},
  {setor:'Suporte Comercial', sis:['trocas','estoca'], chaves:['suportecomercial']},
  {setor:'Live', sis:[], chaves:['live'], obs:'acessos específicos a definir'}
];
const regraDe = setor => { const n=norm(setor); return PADRAO.find(r=>r.chaves.includes(n)); };
const achaSis = k => S.sistemas.find(s=>SIS[k].al.includes(norm(s.nome)));
const achaComp = k => S.compart.find(c=>SIS[k].al.some(a=>norm(c.nome).startsWith(a)));
// Lista do que o setor precisa: [{nome, sis (cadastrado ou undefined)}]
// Edições do padrão feitas na aba "Acessos por setor" (salvas para todos) têm prioridade sobre o padrão de fábrica
const nomeSis = k => SIS[k].nome;
const todosNomes = () => (S.padraoCfg && S.padraoCfg.dados.__todos) || TODOS.map(nomeSis);
function regraEfetiva(r){
  const o = S.padraoCfg && S.padraoCfg.dados[r.setor];
  return o ? {...r, tudo:!!o.tudo, nomes:o.sis||[], editado:true} : {...r, nomes:(r.sis||[]).map(nomeSis)};
}
// Transforma um nome de acesso no item usado na conferência (sistema cadastrado ou conta compartilhada)
function itemDe(nome){
  const k = Object.keys(SIS).find(k=>SIS[k].nome===nome);
  if(k){ const sis=achaSis(k); return {nome, sis, comp:!sis&&achaComp(k)}; }
  const sis = S.sistemas.find(s=>norm(s.nome)===norm(nome));
  return {nome, sis, comp:!sis && S.compart.find(c=>norm(c.nome).startsWith(norm(nome)))};
}
function necessarios(setor){
  const r0 = regraDe(setor); if(!r0) return null;
  const r = regraEfetiva(r0);
  if(r.tudo){
    const lista = Object.keys(SIS).map(k=>({nome:SIS[k].nome, sis:achaSis(k), comp:!achaSis(k)&&achaComp(k)}));
    S.sistemas.filter(s=>s.ativo && !lista.some(i=>i.sis===s)).forEach(s=>lista.push({nome:s.nome, sis:s}));
    return lista;
  }
  return [...new Set([...todosNomes(), ...r.nomes])].map(itemDe);
}
const acessoOk = a => a && a.t!=='na' && (a.t!=='senha' || a.tem || a.v);
// O que falta criar/liberar numa posição (posições desativadas não contam)
function faltas(p){
  if(p.status==='off') return [];
  const n = necessarios(p.setor); if(!n) return [];
  return n.filter(i=>!i.comp && (!i.sis || !acessoOk((p.acessos||{})[i.sis.nome])));
}

const S = { token:'', eu:null, sistemas:[], posicoes:[], compart:[], hist:[], visiveis:{}, cache:{}, carregando:'' };
let aba='posicoes', busca='', filtroSetor='', filtroEquipe='';

/* ===== Utilidades ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js = s => esc(JSON.stringify(s));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9&]/g,'');
const agora = () => new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const admin = () => S.eu && S.eu.nivel === 'admin';
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
const olho='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const copia='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const lapis='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

/* ===== Servidor ===== */
async function call(fn, ...args){
  if(/COLE_AQUI/.test(API)) throw new Error('O link do servidor do Acessos ainda não foi configurado.');
  const corpo = JSON.stringify({fn, args});
  for(let t=0;t<3;t++){
    try{
      const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:corpo});
      const j = await r.json();
      if(!j.ok){ const er = Object.assign(new Error(j.erro||'Erro inesperado.'),{servidor:true});
        if(/grava[cç][oõ]es agora/i.test(er.message) && t<2){ await new Promise(ok=>setTimeout(ok,1500)); continue; } throw er; }
      return j.resultado;
    }catch(e){ if(e.servidor) throw e; await new Promise(ok=>setTimeout(ok,1200)); }
  }
  throw new Error('Sem conexão com o servidor. Verifique a internet e tente de novo.');
}
async function run(fn, ...args){
  try{ return await call(fn, S.token, ...args); }
  catch(e){
    if(/sess[aã]o expirou/i.test(e.message)){ try{ window.parent.postMessage({saintCenter:'sessao-expirou'}, location.origin); }catch(_){} bloqueio('SESSÃO EXPIRADA','Entre de novo pelo Saint Center.',true); }
    throw e;
  }
}
function bloqueio(tit, txt, link){
  $('abas').hidden = true;
  $('app').innerHTML = `<div class="bloqueio"><b>${esc(tit)}</b>${esc(txt)}${link?`<br><a class="btn" href="${SC_CENTER}" target="_top">Abrir o Saint Center</a>`:''}</div>`;
}
// A ordem dos setores fica num registro interno guardado junto com as contas compartilhadas
// (assim vale para todos que abrem o Acessos). Esse registro não aparece na lista de contas.
const CONFIG_ORDEM = '⚙ Ordem dos setores (configuração do sistema)';
const CONFIG_PADRAO = '⚙ Acessos por setor (configuração do sistema)';
const ehConfig = c => c.nome===CONFIG_ORDEM || c.nome===CONFIG_PADRAO;
function aplicar(d){
  S.eu=d.eu; S.sistemas=d.sistemas; S.posicoes=d.posicoes;
  const cfg = (d.compart||[]).find(c=>c.nome===CONFIG_ORDEM);
  let ordem=[]; try{ ordem = cfg ? JSON.parse(cfg.quem||'[]') : []; }catch(_){}
  S.ordemCfg = cfg ? {id:cfg.id, ordem} : {id:'', ordem:[]};
  const cp = (d.compart||[]).find(c=>c.nome===CONFIG_PADRAO);
  let dados={}; try{ dados = cp ? JSON.parse(cp.quem||'{}') : {}; }catch(_){}
  S.padraoCfg = {id: cp?cp.id:'', dados};
  S.compart=(d.compart||[]).filter(c=>!ehConfig(c));
}

/* ===== Ordem: desativados sempre no final ===== */
const sistemasOrdenados = () => [...S.sistemas.filter(s=>s.ativo), ...S.sistemas.filter(s=>!s.ativo)];
/* ===== Ordem dos setores =====
   Setores com o mesmo nome escrito diferente (ex.: "TICKET TRANSPORTE" e "Ticket Transporte") ficam juntos.
   A ordem escolhida em "Ordem dos setores" fica salva no servidor e vale para todos. */
// Cadastros de plataforma (logins usados por várias pessoas): aparecem em Contas Compartilhadas, não em Posições
const SETORES_COMPART = ['mercadolivre','shope','shopee','tiktok','gmail','meta'];
const ehCompart = p => SETORES_COMPART.includes(norm(p.setor));
const posTime = () => S.posicoes.filter(p=>!ehCompart(p));
const grupo = setor => regraDe(setor)?.setor || String(setor||'Sem setor').trim();
function ordemSetores(){
  const salvos = (S.ordemCfg && S.ordemCfg.ordem) || [];
  const presentes = [...new Set(posTime().map(p=>grupo(p.setor)))];
  const todos = [...new Set([...PADRAO.map(r=>r.setor), ...presentes])];
  return [...new Set([...salvos.filter(s=>todos.includes(s)), ...todos])];
}
const posicoesOrdenadas = () => {
  const ordem = ordemSetores(), pos = p => ordem.indexOf(grupo(p.setor));
  // desativados sempre no final; dentro de cada setor, Equipe 01 antes da Equipe 02
  return posTime().map((p,i)=>({p,i})).sort((a,b) =>
    (a.p.status==='off')-(b.p.status==='off') || pos(a.p)-pos(b.p) || String(a.p.equipe||'~').localeCompare(String(b.p.equipe||'~')) || a.i-b.i
  ).map(x=>x.p);
};

// Edição do padrão de um setor (ou do "Todos")
let padraoTemp=null;
function opcoesAcesso(extra){
  const nomes = Object.keys(SIS).map(nomeSis);
  S.sistemas.filter(s=>s.ativo && !Object.keys(SIS).some(k=>SIS[k].al.includes(norm(s.nome)))).forEach(s=>nomes.push(s.nome));
  (extra||[]).forEach(n=>{ if(!nomes.some(x=>norm(x)===norm(n))) nomes.push(n); });
  return nomes;
}
function editarPadrao(chave){
  const todos = chave==='__todos', r0 = todos?null:PADRAO.find(r=>r.setor===chave), r = todos?null:regraEfetiva(r0);
  padraoTemp = {chave, tudo: r?r.tudo:false, sel: todos?[...todosNomes()]:[...r.nomes]};
  desenhaPadrao();
}
function desenhaPadrao(){
  const t=padraoTemp, todos=t.chave==='__todos', base=todos?[]:todosNomes();
  const ops = opcoesAcesso(t.sel).filter(n=>!base.includes(n));
  abrir(`<h3>ACESSOS · ${esc(todos?'TODOS':t.chave.toUpperCase())}</h3><div class="corpo">
    <p style="color:var(--g2)">${todos?'Acessos que todas as posições precisam ter.':'Além dos acessos de todos ('+base.map(esc).join(', ')+'), marque o que este setor precisa.'}</p>
    ${todos?'':`<label class="ck"><input type="checkbox" id="pTudo" ${t.tudo?'checked':''} onchange="padraoTemp.tudo=this.checked;desenhaPadrao()"> Acesso a tudo</label>`}
    ${t.tudo?'':`<div class="req" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">${ops.map(n=>`<label class="ck"><input type="checkbox" data-n="${esc(n)}" ${t.sel.includes(n)?'checked':''} onchange="marcaPadrao(this)"> ${esc(n)}</label>`).join('')}</div>
    <div style="display:flex;gap:8px"><input id="pNovo" placeholder="Outro acesso (ex.: nova plataforma)"><button class="btn sec min" onclick="novoPadrao()">Incluir</button></div>`}

function marcaPadrao(el){ const n=el.dataset.n, s=padraoTemp.sel; if(el.checked){ if(!s.includes(n)) s.push(n); } else padraoTemp.sel=s.filter(x=>x!==n); }
function novoPadrao(){ const n=$('pNovo').value.trim(); if(!n) return; if(!padraoTemp.sel.some(x=>norm(x)===norm(n))) padraoTemp.sel.push(n); desenhaPadrao(); }
async function gravaPadrao(btn, dados, log){
  await salvando(btn, async () => {
    const r = await run('salvarCompart', {id:S.padraoCfg.id||'', nome:CONFIG_PADRAO, quem:JSON.stringify(dados), email:''}, [log]);

function salvaPadrao(btn){

/* ===== Senhas =====
   1º clique num card busca todas as senhas dele de uma vez; os próximos são instantâneos
   e o histórico é gravado em segundo plano (sem esperar). */
function alvoDe(tipo, id, sis){ if(tipo==='c'){ const c=S.compart.find(x=>x.id===id); return c?c.nome:''; } const p=S.posicoes.find(x=>x.id===id); return p ? p.setor+(p.equipe?' ('+p.equipe+')':'')+' · '+sis : sis; }
let filaLog=[], timerLog=null;
function logFundo(acao, alvo){ filaLog.push({acao, alvo}); clearTimeout(timerLog); timerLog=setTimeout(()=>{ const l=filaLog; filaLog=[]; call('registrarUso', S.token, l).catch(()=>{}); }, 600); }
async function pegar(tipo, id, sis, acao){
  const ck = tipo==='c' ? 'c|'+id : id;
  if(S.cache[ck] && (tipo==='c' || S.cache[ck][sis]!==undefined)){ logFundo(acao, alvoDe(tipo,id,sis)); return tipo==='c' ? S.cache[ck] : S.cache[ck][sis]; }
  const k = tipo==='c' ? 'c|'+id : id+'|'+sis;
  S.carregando = k; render();
  try{
    if(tipo==='c') S.cache[ck] = await run('verSenha', 'c', id, '', acao==='copiar'?'copiar':'ver');
    else S.cache[ck] = await run('senhasPosicao', id, sis, acao==='copiar'?'copiar':'ver');
  }finally{ S.carregando=''; }
  return tipo==='c' ? S.cache[ck] : (S.cache[ck][sis] ?? '');
}
async function mostrar(tipo, id, sis){
  const k = tipo==='c' ? 'c|'+id : id+'|'+sis;
  if(S.visiveis[k]!==undefined){ delete S.visiveis[k]; render(); return; }
  try{ S.visiveis[k] = await pegar(tipo, id, sis, 'ver'); }catch(e){ toast(e.message); }
  render();
}
function copiarTexto(v){
  return navigator.clipboard.writeText(v).catch(()=>{ const t=document.createElement('textarea'); t.value=v; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); });
}
async function copiar(tipo, id, sis){
  try{ const v = await pegar(tipo, id, sis, 'copiar'); await copiarTexto(v); toast('Senha copiada'); }catch(e){ toast(e.message); }
  render();
}

/* ===== Posições ===== */
const NOME_ST = {ativo:'Ativa',trein:'Em treinamento',vaga:'Vaga aberta',off:'Desativado'};
function mudancas(p, novo, st, equipe, criarLista, logs){
  if(st==='vaga' && novo && p.status==='vaga') st='ativo'; // preencheu a vaga
  if(st==='vaga') novo='';
  const mudouPessoa = novo!==(p.resp||''), mudouStatus = st!==p.status;
  p.histResp = p.histResp || []; p.trocar = p.trocar || [];
  if(mudouPessoa){ p.histResp.unshift({de:p.resp||'', para:novo||(st==='vaga'?'Vaga aberta':''), quando:agora()}); logs.push({acao:'Trocou responsável', alvo:`${p.setor}: ${p.resp||'—'} → ${novo||'Vaga aberta'}`}); }
  if(mudouStatus && !mudouPessoa) logs.push({acao:'Mudou situação', alvo:`${p.setor}: ${NOME_ST[st]}`});
  if((p.equipe||'')!==equipe){ logs.push({acao:'Mudou equipe', alvo:`${p.setor}: ${p.equipe||'Sem equipe'} → ${equipe||'Sem equipe'}`}); p.equipe=equipe; }
  let aviso='';
  if(mudouStatus && st==='off') aviso='Posição desativada e movida para o final da fila';
  if(mudouPessoa && criarLista!==false && p.resp){ p.trocar = Object.keys(p.acessos||{}).filter(n=>p.acessos[n].t==='senha'&&p.acessos[n].tem); if(p.trocar.length) aviso='Lista de senhas para trocar criada'; }
  p.resp=novo; p.status=st;
  return aviso;
}
function limpa(p){ const c=JSON.parse(JSON.stringify(p)); Object.values(c.acessos||{}).forEach(a=>{ delete a.tem; }); return c; }
function trocarResp(id){
  const p = S.posicoes.find(x=>x.id===id);
  const op = (v,l) => `<option value="${v}" ${p.status===v?'selected':''}>${l}</option>`;
  const temSenha = Object.values(p.acessos||{}).some(a=>a.t==='senha'&&a.tem);
  abrir(`<h3>TROCAR RESPONSÁVEL</h3><div class="corpo">
    <p style="color:var(--g2)">${esc(p.setor)} · ${esc(p.email)}</p>
    <label>Nome da responsável<input id="rNome" value="${esc(p.resp)}" placeholder="Nome da pessoa"></label>
    <label>Equipe<select id="rEquipe"><option value="">Sem equipe</option>${EQUIPES.map(e=>`<option ${p.equipe===e?'selected':''}>${e}</option>`).join('')}</select></label>
    <label>Situação<select id="rStatus">${op('ativo','Ativa')}${op('trein','Em treinamento')}${op('vaga','Vaga aberta')}${op('off','Desativado')}</select></label>
    ${temSenha?'<label class="ck"><input type="checkbox" id="rTrocar" checked> Se a pessoa mudar, criar lista de senhas para trocar</label>':''}
    <div class="sep">HISTÓRICO DE RESPONSÁVEIS</div>
    ${(p.histResp||[]).length?`<ul class="hist">${p.histResp.map(h=>`<li><span>${esc(h.de||'—')} → ${esc(h.para||'—')}</span><small>${esc(h.quando)}</small></li>`).join('')}</ul>`:'<span class="na">Nenhuma troca registrada ainda.</span>'}
  </div><div class="rodape"><button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn" onclick='salvarResp(${js(id)},this)'>Salvar</button></div>`);
}
function salvarResp(id, btn){
  const p = limpa(S.posicoes.find(x=>x.id===id)), logs=[];
  const aviso = mudancas(p, $('rNome').value.trim(), $('rStatus').value, $('rEquipe').value, $('rTrocar')?.checked, logs);
  salvando(btn, async () => { await gravarPos(p, logs); fechar(); render(); if(aviso) toast(aviso); });
}
async function gravarPos(p, logs){
  const r = await run('salvarPosicao', p, logs);
  const i = S.posicoes.findIndex(x=>x.id===r.id);
  if(i>=0) S.posicoes[i]=r; else S.posicoes.push(r);
  Object.keys(S.visiveis).filter(k=>k.startsWith(r.id+'|')).forEach(k=>delete S.visiveis[k]); delete S.cache[r.id];
}
function editar(id){
  const p = id ? S.posicoes.find(x=>x.id===id) : {setor:'',equipe:'',resp:'',status:'ativo',email:'',acessos:{}};
  const op = (v,l,a) => `<option value="${esc(v)}" ${a===v?'selected':''}>${esc(l)}</option>`;
  const linha = s => { const a=(p.acessos||{})[s.nome]||{t:'vazio'}; return `<div class="lin ${s.ativo?'':'off'}" data-n="${esc(s.nome)}" data-tem="${a.t==='senha'&&a.tem?1:''}"><span>${esc(s.nome)}${s.ativo?'':' (desativado)'}</span>
    <select data-p="${esc(s.nome)}" class="fTipo">${op('vazio','—',a.t)}${op('senha','Senha',a.t)}${op('google','Pelo Google',a.t)}${op('frete','Pelo FreteBarato',a.t)}${op('na','Não se aplica',a.t)}</select>
    <input data-p="${esc(s.nome)}" class="fVal" type="text" autocomplete="off" placeholder="${a.t==='senha'&&a.tem?'Manter a senha atual':'Senha'}"></div>`; };
  abrir(`<h3>${id?'EDITAR POSIÇÃO':'NOVA POSIÇÃO'}</h3><div class="corpo">
    <label>Setor<select id="fSetorSel" onchange="trocouSetor()"><option value="">Selecione o setor</option>${ordemSetores().map(s=>PADRAO.find(r=>r.setor===s)).filter(Boolean).map(r=>op(r.setor,r.setor,p.setor)).join('')}${p.setor&&!PADRAO.some(r=>r.setor===p.setor)?`<option value="${esc(p.setor)}" selected>${esc(p.setor)}</option>`:''}<option value="__outro">Outro…</option></select></label>
    <label id="fSetorOutro" style="display:none">Nome do setor<input id="fSetor" value="${esc(p.setor)}"></label>
    <label>Equipe<select id="fEquipe"><option value="">Sem equipe</option>${EQUIPES.map(e=>op(e,e,p.equipe)).join('')}</select></label>
    <label>Responsável<input id="fResp" value="${esc(p.resp)}"></label>
    <label>Situação<select id="fStatus">${op('ativo','Ativa',p.status)}${op('trein','Em treinamento',p.status)}${op('vaga','Vaga aberta',p.status)}${op('off','Desativado',p.status)}</select></label>
    <label>E-mail da posição<input id="fEmail" value="${esc(p.email)}"></label>
    <div class="sep">ACESSOS DO SETOR</div>
    <div class="req" id="reqSetor"></div>
    <div class="sep">ACESSOS · deixe a senha em branco para manter a atual</div>
    ${sistemasOrdenados().map(linha).join('')}
    ${admin()?'<button class="btn sec min" style="justify-self:start" onclick="fechar();novoSistema()">+ Incluir outro sistema</button>':''}
  </div><div class="rodape"><button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn" onclick='salvar(${js(id||'')},this)'>Salvar</button></div>`);
  document.querySelectorAll('.fTipo,.fVal').forEach(el => el.addEventListener(el.tagName==='SELECT'?'change':'input', atualizaReq));
  atualizaReq();
}
function trocouSetor(){
  const v = $('fSetorSel').value, outro = v==='__outro';
  $('fSetorOutro').style.display = outro ? '' : 'none';
  if(outro){ $('fSetor').value=''; $('fSetor').focus(); } else $('fSetor').value = v;
  atualizaReq();
}
// Mostra, conforme o setor escolhido, o que já está cadastrado e o que falta criar/liberar
function atualizaReq(){
  const box = $('reqSetor'); if(!box) return;
  const setor = $('fSetor').value.trim(), n = setor ? necessarios(setor) : null;
  const nomesNec = new Set((n||[]).filter(i=>i.sis).map(i=>i.sis.nome));
  document.querySelectorAll('.lin[data-n]').forEach(l => l.classList.toggle('nec', nomesNec.has(l.dataset.n)));
  if(!setor){ box.innerHTML='<span class="na">Selecione o setor para ver os acessos necessários.</span>'; return; }
  if(!n){ box.innerHTML='<span class="na">Este setor não tem padrão de acessos definido. Cadastre os acessos manualmente abaixo.</span>'; return; }
  const estado = i => {
    if(i.comp) return '<span class="ok">✓ Conta compartilhada</span>';
    if(!i.sis) return '<span class="nc">Sistema não cadastrado</span>';
    const l = document.querySelector(`.lin[data-n="${CSS.escape(i.sis.nome)}"]`); if(!l) return '<span class="falta">Criar / liberar</span>';
    const t = l.querySelector('.fTipo').value, v = l.querySelector('.fVal').value;
    return acessoOk({t, tem:!!l.dataset.tem, v}) && t!=='vazio' ? '<span class="ok">✓ Cadastrado</span>' : '<span class="falta">Criar / liberar</span>';
  };
  const linhas = n.map(i=>({i, e:estado(i)})), falta = linhas.filter(x=>!x.e.includes('ok')).length;
  box.innerHTML = `<div class="r"><span style="color:var(--g2)">${regraDe(setor).tudo?'Liderança e supervisão: acesso a tudo':'Padrão do setor'} · ${n.length} acessos</span><span class="${falta?'falta':'ok'}">${falta?falta+' a criar':'✓ Completo'}</span></div>`
    + linhas.map(x=>`<div class="r"><span>${esc(x.i.nome)}</span>${x.e}</div>`).join('');
}
function salvar(id, btn){
  const acessos={}, trocadas=[];
  document.querySelectorAll('.fTipo').forEach(s => { const n=s.dataset.p, t=s.value; if(t==='vazio') return;
    const v=[...document.querySelectorAll('.fVal')].find(i=>i.dataset.p===n).value;
    if(t==='senha'){ acessos[n] = v ? {t, v} : {t}; if(v) trocadas.push(n); } else acessos[n]={t}; });
  const setor=$('fSetor').value.trim()||'Sem setor', st=$('fStatus').value, resp=$('fResp').value.trim(), email=$('fEmail').value.trim(), equipe=$('fEquipe').value, logs=[];
  let p, aviso='';
  if(id){
    p = limpa(S.posicoes.find(x=>x.id===id));
    Object.assign(p, {setor, email, acessos});
    p.trocar = (p.trocar||[]).filter(n=>!trocadas.includes(n) && acessos[n]);
    trocadas.length && logs.push({acao:'Alterou senha', alvo:`${setor} · ${trocadas.join(', ')}`});
    aviso = mudancas(p, resp, st, equipe, true, logs);
    logs.push({acao:'Editou posição', alvo:setor});
  }else{
    p = {setor, equipe, resp: st==='vaga'?'':resp, status:st, email, acessos, trocar:[], histResp:[]};
    logs.push({acao:'Criou posição', alvo:setor});
  }
  salvando(btn, async () => { await gravarPos(p, logs); fechar(); render(); if(aviso) toast(aviso); });
}
function checklist(id){
  const p = S.posicoes.find(x=>x.id===id);
  abrir(`<h3>SENHAS PARA TROCAR</h3><div class="corpo"><p style="color:var(--g2)">${esc(p.setor)} — troque nas plataformas, cadastre a nova senha em "Editar" ou marque aqui.</p><ul class="check">${p.trocar.map(n=>`<li><input type="checkbox" data-n="${esc(n)}"> ${esc(n)}</li>`).join('')}</ul></div>
  <div class="rodape"><button class="btn sec" onclick="fechar()">Fechar</button><button class="btn" onclick='concluir(${js(id)},this)'>Marcar como trocadas</button></div>`);
}
function concluir(id, btn){
  const p = limpa(S.posicoes.find(x=>x.id===id)), feitos=[...document.querySelectorAll('.check input:checked')].map(c=>c.dataset.n);
  if(!feitos.length){ fechar(); return; }
  p.trocar = p.trocar.filter(n=>!feitos.includes(n));
  salvando(btn, async () => { await gravarPos(p, [{acao:'Confirmou troca de senha', alvo:`${p.setor} · ${feitos.join(', ')}`}]); fechar(); render(); });
}

/* ===== Importação CSV (planilha ACESSOS SG!) ===== */
function parseCSV(txt){const r=[];let row=[],cel='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'&&txt[i+1]==='"'){cel+='"';i++}else if(c==='"')q=false;else cel+=c}else if(c==='"')q=true;else if(c===','){row.push(cel);cel=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cel);r.push(row);row=[];cel=''}else cel+=c}if(cel||row.length){row.push(cel);r.push(row)}return r}
function importar(ev){
  const f = ev.target.files[0]; ev.target.value=''; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const linhas = parseCSV(rd.result), hi = linhas.findIndex(l=>l.some(c=>norm(c)==='email'));
    if(hi<0){ toast('Não encontrei a coluna E-mail no arquivo'); return; }
    const cabB = linhas[hi], cab = cabB.map(norm), iE = cab.indexOf('email'), iR = cab.findIndex(c=>c.startsWith('re')&&c.includes('ponsavel')), iQ = cab.findIndex(c=>c==='equipe'||c==='time');
    const mapa = {}, novosSis = [];
    cabB.forEach((h,i) => { if(i<=Math.max(iE,iR) || i===iQ || !h.trim()) return;
      const n = norm(h); const s = S.sistemas.find(x=>norm(x.nome)===n || (n==='saintrocas'&&norm(x.nome)==='sainttrocas'));
      const nome = s ? s.nome : h.trim(); if(!s) novosSis.push(nome); mapa[nome]=i; });
    const pos=[], comp=[];
    linhas.slice(hi+1).forEach(l => {
      const setor=(l[0]||'').trim(); if(!setor) return;
      const email=(l[iE]||'').trim(), respB=(l[iR]||'').trim(), acessos={};
      Object.entries(mapa).forEach(([n,i]) => { const v=(l[i]||'').trim(), nv=norm(v); if(!v) return;
        acessos[n] = nv.includes('naoseaplica')?{t:'na'} : nv.includes('pelogoogle')?{t:'google'} : nv.includes('pelofretebarato')?{t:'frete'} : {t:'senha',v}; });
      if(/trello|procon|reclame/i.test(setor)){ const g=Object.values(acessos).find(a=>a.t==='senha'); comp.push({nome:setor,quem:respB,email,senha:g?g.v:''}); return; }
      const nr=norm(respB); let status='ativo', resp=respB;
      if(nr.includes('vagaaberta')){ status='vaga'; resp=''; }
      else if(nr.includes('desativad')){ status='off'; resp=respB.split('-')[0].replace(/desativad[oa]/i,'').trim(); }
      else if(nr.includes('treinamento')){ status='trein'; resp=respB.split('-')[0].trim(); }
      const qv = norm(l[iQ]||''), equipe = iQ<0 ? '' : (/01$|1$/.test(qv) ? 'Equipe 01' : /02$|2$/.test(qv) ? 'Equipe 02' : '');
      pos.push({setor, equipe, resp, status, email, acessos, trocar:[], histResp:[]});
    });
    if(!pos.length && !comp.length){ toast('Nenhuma linha encontrada no arquivo'); return; }
    // a importação substitui as contas compartilhadas: mantém o registro da ordem dos setores
    if(S.ordemCfg.ordem.length) comp.push({nome:CONFIG_ORDEM, quem:JSON.stringify(S.ordemCfg.ordem), email:'', senha:''});
    if(Object.keys(S.padraoCfg.dados).length) comp.push({nome:CONFIG_PADRAO, quem:JSON.stringify(S.padraoCfg.dados), email:'', senha:''});
    abrir(`<h3>IMPORTAR PLANILHA</h3><div class="corpo">
      <p>Encontrei <b>${pos.length}</b> posições e <b>${comp.filter(c=>!ehConfig(c)).length}</b> contas compartilhadas${novosSis.length?` e <b>${novosSis.length}</b> sistema(s) novo(s): ${esc(novosSis.join(', '))}`:''}.</p>
      ${S.posicoes.length||S.compart.length?'<p style="color:var(--g2)">Atenção: a importação substitui as posições e contas que já estão no sistema. Sua planilha original não é alterada.</p>':''}
    </div><div class="rodape"><button class="btn sec" onclick="fechar()">Cancelar</button><button class="btn" id="btnImp">Importar</button></div>`);
    $('btnImp').onclick = () => salvando($('btnImp'), async () => { const d = await run('importar', pos, comp, novosSis); aplicar(d); S.visiveis={}; S.cache={}; fechar(); render(); toast(`Importado: ${pos.length} posições e ${S.compart.length} contas compartilhadas`); });
  };
  rd.readAsText(f, 'UTF-8');
}

/* ===== Início ===== */
(async function iniciar(){
  try{ S.token = localStorage.getItem('sc-token') || ''; }catch(_){}
  if(!S.token){ bloqueio('ENTRE PELO SAINT CENTER','O módulo Acessos usa o mesmo login do Saint Center.',true); return; }
  try{ aplicar(await call('carregar', S.token)); render(); }
  catch(e){
    if(/n[aã]o tem acesso/i.test(e.message)) bloqueio('ACESSO RESTRITO','Este módulo é exclusivo da coordenação e da supervisão.');
    else if(/sess[aã]o expirou/i.test(e.message)) bloqueio('SESSÃO EXPIRADA','Entre de novo pelo Saint Center.',true);
    else bloqueio('NÃO FOI POSSÍVEL CARREGAR', e.message);
  }
})();
